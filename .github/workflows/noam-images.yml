name: noam-images
on:
  push:
    paths: [noam/img/sources.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and resize
        run: |
          cd noam/img
          while read name id; do
            [ -z "$name" ] && continue
            if curl -fsSL -A "Mozilla/5.0" -o "raw-$name" "https://unsplash.com/photos/$id/download?force=true"; then
              convert "raw-$name" -auto-orient -resize '1600x1600>' -strip -quality 80 "$name.jpg" && echo "ok $name"
            else echo "FAIL $name"; fi
            rm -f "raw-$name"
          done < sources.txt
          ls -la
      - name: Commit
        run: |
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add noam/img/*.jpg && git commit -m "noam: fetch candidate photos" && git push || echo "nothing to commit"
