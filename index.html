/* Layout: the club's flyer template as a web page. White logo strip, olive title band with the
   lime diagonal, cream body with white side-barred cards, olive CTA bars, Galilee landscape footer.
   Two taps: who (in the band), then WhatsApp (on the card). One light look, like the printed template. */
:root{
  --olive:#3d4617; --olive-2:#4a5520; --lime:#a8bb43; --lime-soft:#f0f3e2;
  --sage:#e8edd8; --sage-line:#cfd8ab; --act:#5a6a2b; --act-2:#4e5d24; --on:#8d9c4f; --stripe:#bccb7d;
  --cream:#f3f1e8; --white:#ffffff; --ink:#262b12; --muted:#6a6d58; --line:#e3e1d4;
  --font:"Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r:18px;
  --spring:cubic-bezier(.2,.9,.25,1);
  color-scheme:light;
}
html{scroll-behavior:smooth}
body{background:var(--cream);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.in{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.logos{background:var(--white);border-bottom:1px solid var(--line)}
.logos .in{display:grid;grid-template-columns:repeat(4,auto);justify-content:space-between;align-items:center;gap:10px;padding-block:8px}
.logos img{display:block;height:clamp(28px,6vw,52px);width:auto;max-width:100%;object-fit:contain}
.logos img.club{height:clamp(40px,8vw,70px)}

.band{position:relative;background:var(--sage);color:var(--olive);padding-bottom:clamp(34px,5vw,56px)}
.band::after{content:"";position:absolute;inset-inline:0;bottom:0;height:clamp(20px,3vw,40px);background:linear-gradient(var(--cream),var(--cream)) bottom/100% 0 no-repeat;
  background:var(--cream);clip-path:polygon(0 100%,100% 100%,100% 0,0 calc(100% - 4px))}
.band::before{content:"";position:absolute;inset-inline:0;bottom:clamp(8px,1.4vw,16px);height:clamp(22px,3vw,40px);background:var(--stripe);
  clip-path:polygon(0 calc(100% - 7px),100% 0,100% 9px,0 100%)}
.band .in{position:relative;z-index:1;display:grid;gap:clamp(10px,1.8vw,20px);padding-block:clamp(16px,3.5vw,44px) 0}
.eyebrow{color:#6b7b2a;font-weight:700;font-size:clamp(16px,2.2vw,22px);margin:0}
h1{margin:0;font-weight:700;font-size:clamp(30px,6vw,64px);line-height:1.02;letter-spacing:-.02em;text-wrap:balance}
.who{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:760px}
.who button{font:inherit;font-weight:700;font-size:clamp(16px,1.9vw,19px);line-height:1.2;color:var(--olive);
  background:var(--white);border:2px solid var(--sage-line);border-radius:14px;min-height:54px;padding:8px 8px;cursor:pointer;
  transition:transform 120ms ease-out,background 160ms ease-out,color 160ms ease-out,border-color 160ms ease-out}
.who button:hover{border-color:var(--on)}
.who button:active{transform:scale(.97)}
.who button[aria-pressed="true"]{background:var(--act);border-color:var(--act);color:var(--white)}
@media (max-width:420px){.who button{font-size:15px}}

main .in{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.9fr);gap:clamp(20px,3vw,40px);align-items:start;padding-block:clamp(10px,2.4vw,32px) clamp(24px,4vw,48px)}
@media (max-width:900px){main .in{grid-template-columns:1fr}}
.pane{scroll-margin-top:12px}

.where{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:#e9e7dc;border-radius:12px;padding:3px;margin-bottom:10px}
.where[hidden]{display:none}
.where .thumb{position:absolute;left:0;top:3px;bottom:3px;width:0;border-radius:11px;background:var(--white);box-shadow:0 1px 2px rgba(38,43,18,.12),0 4px 12px rgba(38,43,18,.08);
  transition:transform 380ms var(--spring),width 380ms var(--spring)}
.where button{position:relative;z-index:1;font:inherit;font-weight:500;font-size:16px;color:var(--muted);background:none;border:0;border-radius:10px;min-height:40px;cursor:pointer;transition:color 160ms,transform 110ms}
.where button[aria-pressed="true"]{color:var(--olive);font-weight:700}
.where button:active{transform:scale(.97)}

.results{display:grid;gap:12px}
.card{position:relative;background:var(--white);border-radius:var(--r);padding:16px 24px 16px 16px;display:grid;gap:10px;
  box-shadow:0 2px 0 var(--line),0 12px 28px -18px rgba(38,43,18,.28)}
.card::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:7px;border-start-start-radius:var(--r);border-end-start-radius:var(--r);background:var(--stripe)}
.card .top{display:flex;align-items:baseline;justify-content:space-between;gap:6px 14px;flex-wrap:wrap}
.card h2{margin:0;font-size:clamp(22px,3vw,28px);line-height:1.1;letter-spacing:-.01em}
.card h2 small{font-size:.68em;font-weight:500;color:var(--muted);margin-inline-start:8px;letter-spacing:0}
.card .when{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;color:var(--olive)}
.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.week span{display:grid;place-items:center;height:36px;border-radius:10px;background:var(--cream);color:#a9a893;font-weight:500}
.week span.on{background:var(--on);color:var(--white);font-weight:700}
.facts{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:18px;font-variant-numeric:tabular-nums}
.facts b{font-weight:700}
.price{display:flex;flex-wrap:wrap;gap:2px 14px;color:var(--muted);font-size:15px}
.price b{color:var(--ink);font-weight:700}
.go{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--act);color:var(--white);text-decoration:none;
  font-weight:700;font-size:18px;border-radius:14px;min-height:52px;padding:10px 18px;transition:transform 110ms ease-out,background 160ms}
.go em{font-style:normal;color:#dfe8b0}
.go:hover{background:var(--act-2)}
.go:active{transform:scale(.98)}
.go svg{width:22px;height:22px;flex:none;color:#dfe8b0}
.enter{animation:enter 420ms var(--spring) both}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.enter{animation:fade 180ms ease both}@keyframes fade{from{opacity:0}to{opacity:1}}.where .thumb{transition:none}html{scroll-behavior:auto}}

.side{display:grid;gap:16px;position:sticky;top:16px}
.photo{margin:0;border-radius:var(--r);overflow:hidden;background:var(--sage);box-shadow:0 12px 28px -18px rgba(38,43,18,.4)}
.photo img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 62%}
.photo figcaption{color:var(--olive);font-weight:500;padding:10px 14px}
.photo figcaption b{color:#6b7b2a;font-weight:500}
@media (max-width:900px){.side{position:static}.photo img{aspect-ratio:16/10}}

.week-all{background:var(--white);border-radius:var(--r);padding:18px 20px;box-shadow:0 2px 0 var(--line)}
.week-all h3{margin:0 0 4px;font-size:20px}
.week-all dl{margin:0;display:grid;gap:8px}
.week-all dt{font-weight:700;color:var(--olive);margin-top:8px}
.week-all dd{margin:0;display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.week-all dd span:last-child{color:var(--muted);text-align:left}

.call{background:var(--sage);color:var(--olive)}
.call .in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding-block:22px}
.call p{margin:0;font-size:19px;font-weight:500}
.num{font-size:clamp(26px,4vw,34px);font-weight:700;color:var(--act);direction:ltr;unicode-bidi:isolate;user-select:all;font-variant-numeric:tabular-nums}
.copy{font:inherit;font-weight:700;color:var(--white);background:var(--act);border:0;border-radius:12px;min-height:48px;padding:8px 18px;cursor:pointer;transition:transform 110ms}
.copy:active{transform:scale(.97)}
.land{display:block;width:100%;height:auto}
.foot{background:#56632e;color:#e7ecd2;font-size:14px;text-align:center;padding-block:14px}

button:focus-visible,a:focus-visible{outline:3px solid var(--on);outline-offset:3px}
</style>

</head>
<body>

  thumb.style.width = on.offsetWidth + "px";
  thumb.style.transform = `translateX(${on.offsetLeft}px)`;
}

function renderWhere(halls) {
  const box = document.getElementById("where");
  box.querySelectorAll("button").forEach((b) => b.remove());
  box.hidden = halls.length < 2;
  if (box.hidden) return;
  for (const [id, label] of [["all", "כל האולמות"], ...halls.map((h) => [h, HALLS[h]])]) {
    const b = document.createElement("button");
    b.type = "button"; b.id = "where-" + id; b.textContent = label;
    b.setAttribute("aria-pressed", String(id === where));
    b.addEventListener("click", () => {
      where = id;
      box.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      placeThumb(); renderCards();
    });
    box.append(b);
  }
  requestAnimationFrame(placeThumb);
}

function card(g, i) {
  const a = document.createElement("article");
  a.className = "card enter";
  a.style.animationDelay = i * 60 + "ms";
  a.innerHTML = `<div class="top"><h2>${g.name}<small>${HALLS[g.hall]}</small></h2><span class="when">${g.hours}</span></div>
    <div class="week" aria-label="ימי אימון: ${dayText(g)}">${DAYS.map((d, k) => `<span class="${g.days.includes(k) ? "on" : ""}">${d}</span>`).join("")}</div>
    <div class="price"><span>מאמן <b>${g.coach}</b></span>${g.price.map((p) => `<span>${p}</span>`).join("")}</div>
    <a class="go" href="${waLink(g)}" target="_blank" rel="noopener">${WA}קבעו אימון ניסיון <em>בוואטסאפ</em></a>`;
  return a;
}

const mine = () => GROUPS.filter((g) => g.who === who);
function renderCards() {
  const box = document.getElementById("results");
  box.innerHTML = "";
  mine().filter((g) => where === "all" || g.hall === where).forEach((g, i) => box.append(card(g, i)));
}
function renderResults() { renderWhere([...new Set(mine().map((g) => g.hall))]); renderCards(); }

document.getElementById("weekall").innerHTML = "<h3>כל האימונים בשבוע</h3><dl>" +
  Object.entries(HALLS).map(([id, name]) => `<dt>${name}</dt>` +
    GROUPS.filter((g) => g.hall === id).map((g) => `<dd><span>${g.name}</span><span>${dayText(g)}, ${g.hours}</span></dd>`).join("")).join("") + "</dl>";

document.getElementById("copy").addEventListener("click", (e) => {
  const btn = e.currentTarget;
  navigator.clipboard.writeText("050-4999149").then(() => { btn.textContent = "הועתק"; }).catch(() => {
    const r = document.createRange(); r.selectNodeContents(document.getElementById("phone"));
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  });
});
addEventListener("resize", placeThumb);
document.documentElement.dir = "rtl"; document.documentElement.lang = "he";
renderWho(); renderResults();
</script>

</body>
</html>
