name: noam-images
on:
  push:
    paths: [noam/img/fetch.py]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check and fetch photos
        run: cd noam/img && python3 fetch.py && rm -f *.raw && ls
      - name: Commit
        run: |
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add noam/img/*.jpg && git commit -m "noam: fetch candidate photos" && git push || echo "nothing to commit"
