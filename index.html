/* Layout: the club's flyer template as a web page. White logo strip, olive title band with the
   lime diagonal, cream body with white side-barred cards, olive CTA bars, Galilee landscape footer.
   Two taps: who (in the band), then WhatsApp (on the card). One light look, like the printed template. */
:root{
  --olive:#3d4617; --olive-2:#4a5520; --lime:#a8bb43; --lime-soft:#f0f3e2;
  --sage:#e8edd8; --sage-line:#cfd8ab; --act:#5a6a2b; --act-2:#4e5d24; --on:#8d9c4f; --stripe:#bccb7d;
  --cream:#f3f1e8; --white:#ffffff; --ink:#262b12; --muted:#6a6d58; --line:#e3e1d4;
  --font:"Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r:18px;
  --spring:cubic-bezier(.2,.9,.25,1);
  color-scheme:only light;
}
html{scroll-behavior:smooth}
body{background:var(--cream);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%}
.in{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.logos{background:var(--white);border-bottom:1px solid var(--line)}
.logos .in{display:grid;grid-template-columns:repeat(4,auto);justify-content:space-between;align-items:center;gap:10px;padding-block:8px}
.logos img{display:block;height:clamp(28px,6vw,52px);width:auto;max-width:100%;object-fit:contain}
.logos img.club{height:clamp(40px,8vw,70px)}

.band{position:relative;background:var(--sage);color:var(--olive);padding-bottom:clamp(34px,5vw,56px)}
.band::after{content:"";position:absolute;inset-inline:0;bottom:0;height:clamp(20px,3vw,40px);background:linear-gradient(var(--cream),var(--cream)) bottom/100% 0 no-repeat;
  background:var(--cream);clip-path:polygon(0 100%,100% 100%,100% 0,0 calc(100% - 4px))}
.band::before{content:"";position:absolute;inset-inline:0;bottom:clamp(8px,1.4vw,16px);height:clamp(22px,3vw,40px);background:var(--stripe);
  clip-path:polygon(0 calc(100% - 7px),100% 0,100% 9px,0 100%)}
.band .in{position:relative;z-index:1;display:grid;gap:clamp(10px,1.8vw,20px);padding-block:clamp(16px,3.5vw,44px) 0}
.eyebrow{color:#6b7b2a;font-weight:700;font-size:clamp(16px,2.2vw,22px);margin:0}
h1{margin:0;font-weight:700;font-size:clamp(30px,6vw,64px);line-height:1.02;letter-spacing:-.02em;text-wrap:balance}
.who{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:760px}
.who button{font:inherit;font-weight:700;font-size:clamp(16px,1.9vw,19px);line-height:1.2;color:var(--olive);
  background:var(--white);border:2px solid var(--sage-line);border-radius:14px;min-height:54px;padding:8px 8px;cursor:pointer;
  transition:transform 120ms ease-out,background 160ms ease-out,color 160ms ease-out,border-color 160ms ease-out}
.who button:hover{border-color:var(--on)}
.who button:active{transform:scale(.97)}
.who button[aria-pressed="true"]{background:var(--act);border-color:var(--act);color:var(--white)}
@media (max-width:420px){.who button{font-size:15px}}

main .in{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.9fr);gap:clamp(20px,3vw,40px);align-items:start;padding-block:clamp(10px,2.4vw,32px) clamp(24px,4vw,48px)}
@media (max-width:900px){main .in{grid-template-columns:1fr}}
.pane{scroll-margin-top:12px}

.where{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:#e9e7dc;border-radius:12px;padding:3px;margin-bottom:10px}
.where[hidden]{display:none}
.where .thumb{position:absolute;left:0;top:3px;bottom:3px;width:0;border-radius:11px;background:var(--white);box-shadow:0 1px 2px rgba(38,43,18,.12),0 4px 12px rgba(38,43,18,.08);
  transition:transform 380ms var(--spring),width 380ms var(--spring)}
.where button{position:relative;z-index:1;font:inherit;font-weight:500;font-size:16px;color:var(--muted);background:none;border:0;border-radius:10px;min-height:46px;cursor:pointer;transition:color 160ms,transform 110ms}
.where button[aria-pressed="true"]{color:var(--olive);font-weight:700}
.where button:active{transform:scale(.97)}

.results{display:grid;gap:12px}
.card{position:relative;background:var(--white);border-radius:var(--r);padding:16px 24px 16px 16px;display:grid;gap:10px;
  box-shadow:0 2px 0 var(--line),0 12px 28px -18px rgba(38,43,18,.28)}
.card::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:7px;border-start-start-radius:var(--r);border-end-start-radius:var(--r);background:var(--stripe)}
.card .top{display:flex;align-items:baseline;justify-content:space-between;gap:6px 14px;flex-wrap:wrap}
.card h2{margin:0;font-size:clamp(22px,3vw,28px);line-height:1.1;letter-spacing:-.01em}
.card h2 small{font-size:.68em;font-weight:500;color:var(--muted);margin-inline-start:8px;letter-spacing:0}
.card .when{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;color:var(--olive)}
.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.week span{display:grid;place-items:center;height:36px;border-radius:10px;background:var(--cream);color:#a9a893;font-weight:500}
.week span.on{background:var(--on);color:var(--white);font-weight:700}
.facts{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:18px;font-variant-numeric:tabular-nums}
.facts b{font-weight:700}
.price{display:flex;flex-wrap:wrap;gap:2px 14px;color:var(--muted);font-size:15px}
.price b{color:var(--ink);font-weight:700}
.go{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--act);color:var(--white);text-decoration:none;
  font-weight:700;font-size:18px;border-radius:14px;min-height:52px;padding:10px 18px;transition:transform 110ms ease-out,background 160ms}
.go em{font-style:normal;color:#dfe8b0}
.go:hover{background:var(--act-2)}
.go:active{transform:scale(.98)}
.go svg{width:22px;height:22px;flex:none;color:#dfe8b0}
.enter{animation:enter 420ms var(--spring) both}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.enter{animation:fade 180ms ease both}@keyframes fade{from{opacity:0}to{opacity:1}}.where .thumb{transition:none}html{scroll-behavior:auto}}

.side{display:grid;gap:16px;position:sticky;top:16px}
.gallery{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;
  padding-bottom:2px;-webkit-overflow-scrolling:touch}
.gallery::-webkit-scrollbar{display:none}
.gallery figure{flex:none;margin:0;scroll-snap-align:start;display:grid;gap:4px}
.gallery img{display:block;height:150px;width:auto;border-radius:14px;object-fit:cover;box-shadow:0 2px 0 var(--line)}
.gallery .tall img{aspect-ratio:3/4}.gallery .wide img{aspect-ratio:4/3}
.gallery figcaption{font-size:14px;font-weight:500;color:var(--muted);padding-inline:4px}
@media (prefers-reduced-motion:no-preference){.gallery img{transition:transform .25s var(--spring)}.gallery figure:active img{transform:scale(.97)}}
@media (min-width:901px){.gallery{display:grid;grid-template-columns:1fr 1fr;overflow:visible}
  .gallery figure:first-child{grid-column:1/-1}
  .gallery img,.gallery .tall img,.gallery .wide img{width:100%;height:auto;aspect-ratio:4/3}
  .gallery figure:first-child img{aspect-ratio:16/9}}
@media (max-width:900px){.side{position:static}}
.week-all{background:var(--white);border-radius:var(--r);padding:18px 20px;box-shadow:0 2px 0 var(--line)}
.week-all h3{margin:0 0 4px;font-size:20px}
.week-all dl{margin:0;display:grid;gap:8px}
.week-all dt{font-weight:700;color:var(--olive);margin-top:8px}
.week-all dd{margin:0;display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.week-all dd span:last-child{color:var(--muted);text-align:left}

.call{background:var(--sage);color:var(--olive)}
.call .in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding-block:22px}
.call p{margin:0;font-size:19px;font-weight:500}
.num{font-size:clamp(26px,4vw,34px);font-weight:700;color:var(--act);direction:ltr;unicode-bidi:isolate;user-select:all;font-variant-numeric:tabular-nums}
.copy{font:inherit;font-weight:700;color:var(--white);background:var(--act);border:0;border-radius:12px;min-height:48px;padding:8px 18px;cursor:pointer;transition:transform 110ms}
.copy:active{transform:scale(.97)}
.land{display:block;width:100%;height:auto}
.foot{background:#56632e;color:#e7ecd2;font-size:14px;text-align:center;padding-block:14px}


/* ping-pong ball that hops between choices */
.ball{position:absolute;left:0;top:0;width:20px;height:20px;border-radius:50%;z-index:20;pointer-events:none;
  background:radial-gradient(circle at 35% 30%,#fff 0 35%,#f1f1ea 60%,#d9d9cc 100%);
  box-shadow:0 3px 6px rgba(38,43,18,.28);will-change:transform}
.ball[hidden]{display:none}
.who button,.where button{position:relative}

/* mobile: contact bar in the thumb zone */
.dock{display:none}
@media (max-width:760px){
  .call{display:none}
  .dock{display:flex;position:fixed;z-index:30;inset-inline:0;bottom:0;align-items:center;justify-content:space-between;gap:12px;
    padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
    background:rgba(243,241,232,.82);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);
    border-top:1px solid rgba(255,255,255,.6);box-shadow:0 -6px 20px -14px rgba(38,43,18,.35)}
  .dock span{font-weight:500;color:var(--olive)}
  .dock span b{display:block;font-size:20px;direction:ltr;unicode-bidi:isolate;text-align:right;font-variant-numeric:tabular-nums}
  .dock a{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 18px;border-radius:999px;background:var(--white);color:var(--act);
    border:2px solid var(--sage-line);font-weight:700;text-decoration:none;transition:transform 110ms}
  .dock a:active{transform:scale(.97)}
  .dock svg{width:20px;height:20px}
  .foot{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-transparency:reduce){.dock{background:var(--cream);-webkit-backdrop-filter:none;backdrop-filter:none}}
button:focus-visible,a:focus-visible{outline:3px solid var(--on);outline-offset:3px}
</style>

</head>
<body>
<header class="logos">
  <div class="in">
    <img src="img/logo_matnas.png" alt="מתנ&quot;ס אזורי מבואות החרמון">
    <img src="img/logo_one.png" alt="כוחו של האחד">
    <img class="club" src="img/logo_club.png" alt="מועדון טניס שולחן מבואות החרמון ע&quot;ש רוני גלבוע">
    <img src="img/logo_council.png" alt="מועצה אזורית מבואות החרמון">
  </div>
</header>

<section class="band">
  <div class="in">
    <p class="eyebrow">אימון ניסיון חינם, בכל מועד</p>
    <h1>איזו קבוצה מתאימה לי?</h1>
    <div class="who" id="who" role="group" aria-label="למי האימון"></div>
  </div>
</section>

<main>
  <div class="in">
    <section class="pane" id="pane" aria-label="הקבוצה שמתאימה">
      <div class="where" id="where" role="group" aria-label="אולם"><span class="thumb" id="thumb"></span></div>
      <div class="results" id="results" aria-live="polite"></div>
    </section>
    <aside class="side">
      <div class="gallery" id="gallery" aria-label="תמונות מהאולמות">
        <figure class="tall"><img loading="lazy" decoding="async" src="img/g_korazim_kids.jpg" alt="ילדים מתאמנים באולם רמת כורזים"><figcaption>רמת כורזים</figcaption></figure>
        <figure class="tall"><img loading="lazy" decoding="async" src="img/g_shear_kid.jpg" alt="ילד מתאמן עם כדור פיזיו באולם שאר ישוב"><figcaption>שאר ישוב</figcaption></figure>
        <figure class="wide"><img loading="lazy" decoding="async" src="img/g_korazim_hall.jpg" alt="האולם ברמת כורזים בזמן אימון"><figcaption>האולם בכורזים</figcaption></figure>
        <figure class="tall"><img loading="lazy" decoding="async" src="img/g_korazim_adults.jpg" alt="אימון בוגרים ברמת כורזים"><figcaption>בוגרים</figcaption></figure>
        <figure class="wide"><img loading="lazy" decoding="async" src="img/pk.jpg" alt="קבוצת מנצחי פרקינסון של המועדון"><figcaption>מנצחי פרקינסון</figcaption></figure>
      </div>
      <div class="week-all" id="weekall"></div>
    </aside>
  </div>
</main>

<section class="call">
  <div class="in">
    <p>שאלות? מדברים עם שחר</p>
    <span class="num" id="phone">050-4999149</span>
    <button class="copy" id="copy" type="button">העתקת המספר</button>
  </div>
</section>
<img class="land" src="img/land.png" alt="">
<div class="foot"><div class="in">מועדון טניס שולחן מבואות החרמון ע"ש רוני גלבוע. ההרשמה והתשלום דרך המתנ"ס.</div></div>

<span class="ball" id="ball" hidden aria-hidden="true"></span>
<nav class="dock" aria-label="יצירת קשר">
  <span>שחר, מנהל המועדון<b>050-4999149</b></span>
  <a href="tel:+972504999149"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M6.6 10.8a15.2 15.2 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>חיוג</a>
</nav>
<script>
const PHONE = "972504999149";
const DAYS = ["א׳", "ב׳", "ג׳", "ד׳", "ה׳"];
const DAYNAMES = ["ראשון", "שני", "שלישי", "רביעי", "חמישי"];
const WHO = [
  { id: "kids", label: "ילדים מתחילים" },
  { id: "adults", label: "בוגרים וסטודנטים" },
  { id: "pk", label: "מנצחי פרקינסון" },
];
const HALLS = { shear: "שאר ישוב", korazim: "רמת כורזים", dafna: "דפנה" };
const GROUPS = [
  { who: "kids", hall: "shear", name: "מתחילים", days: [0, 4], hours: "16:30-17:30", coach: "טאו", price: ["190 ₪ לחודש, פעם בשבוע", "290 ₪ לחודש, פעמיים"] },
  { who: "kids", hall: "korazim", name: "מתחילים", days: [1, 3], hours: "16:30-18:00", coach: "דניאל", price: ["190 ₪ לחודש, פעם בשבוע", "290 ₪ לחודש, פעמיים"] },
  { who: "advanced", hall: "shear", name: "מתקדמים", days: [0, 1, 4], hours: "17:30-19:00", coach: "שחר", price: ["290 ₪ לחודש, פעמיים בשבוע", "390 ₪ לחודש, שלוש פעמים"] },
  { who: "adults", hall: "korazim", name: "בוגרים", days: [1, 3], hours: "18:00-20:00", coach: "דניאל", price: ["190 ₪ לחודש, פעם בשבוע", "290 ₪ לחודש, פעמיים"] },
  { who: "adults", hall: "dafna", name: "בוגרים וסטודנטים", the: "הבוגרים והסטודנטים", days: [1, 4], hours: "19:30-21:00", coach: "דור", price: ["190 ₪ לחודש, פעם בשבוע", "290 ₪ לחודש, פעמיים"] },
  { who: "pk", hall: "shear", name: "מנצחי פרקינסון", days: [0], hours: "09:00-10:00", coach: "שחר", price: ["100 ₪ לחודש"] },
];
const WA = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3a.5.5 0 0 0 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7a2.8 2.8 0 0 0 1.9-1.3 2.3 2.3 0 0 0 .1-1.3c0-.1-.2-.2-.4-.3z"/></svg>';

const dayText = (g) => { const n = g.days.map((d) => DAYNAMES[d]); return n.length > 2 ? n.join(", ") : n.join(" ו"); };
const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

let who = "kids", where = "all";
try { const s = JSON.parse(localStorage.getItem("pick") || "{}"); if (WHO.some((w) => w.id === s.who)) who = s.who; } catch {}

function waLink(g) {
  const at = "ב" + HALLS[g.hall], when = `${dayText(g)}, ${g.hours}`;
  const text = g.who === "pk"
    ? `שלום שחר, אשמח להגיע לאימון ניסיון בקבוצת מנצחי פרקינסון ${at} (${when}).`
    : g.who === "adults"
      ? `שלום שחר, אשמח להגיע לאימון ניסיון בקבוצת ${g.the || "ה" + g.name} ${at} (${when}).`
      : `שלום שחר, אשמח לתאם אימון ניסיון לילד/ה שלי בקבוצת ה${g.name} ${at} (${when}).`;
  return `https://wa.me/${PHONE}?text=${encodeURIComponent(text)}`;
}

function renderWho() {
  const box = document.getElementById("who");
  box.innerHTML = "";
  for (const w of WHO) {
    const b = document.createElement("button");
    b.type = "button"; b.id = "who-" + w.id; b.textContent = w.label;
    b.setAttribute("aria-pressed", String(w.id === who));
    b.addEventListener("click", () => {
      who = w.id; where = "all";
      try { localStorage.setItem("pick", JSON.stringify({ who })); } catch {}
      renderWho(); renderResults();
      hop(document.getElementById("who-" + w.id));
      const pane = document.getElementById("pane"), y = pane.getBoundingClientRect().top;
      if (y > innerHeight * .6 || y < 0) pane.scrollIntoView({ behavior: calm() ? "auto" : "smooth", block: "start" });
    });
    box.append(b);
  }
}

function placeThumb() {
  const box = document.getElementById("where"), thumb = document.getElementById("thumb");
  const on = box.querySelector('button[aria-pressed="true"]');
  if (!on) return;
  thumb.style.width = on.offsetWidth + "px";
  thumb.style.transform = `translateX(${on.offsetLeft}px)`;
}

function renderWhere(halls) {
  const box = document.getElementById("where");
  box.querySelectorAll("button").forEach((b) => b.remove());
  box.hidden = halls.length < 2;
  if (box.hidden) return;
  for (const [id, label] of [["all", "כל האולמות"], ...halls.map((h) => [h, HALLS[h]])]) {
    const b = document.createElement("button");
    b.type = "button"; b.id = "where-" + id; b.textContent = label;
    b.setAttribute("aria-pressed", String(id === where));
    b.addEventListener("click", () => {
      where = id;
      box.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      placeThumb(); renderCards(); hop(b);
    });
    box.append(b);
  }
  requestAnimationFrame(placeThumb);
}

function card(g, i) {
  const a = document.createElement("article");
  a.className = "card enter";
  a.style.animationDelay = i * 60 + "ms";
  a.innerHTML = `<div class="top"><h2>${g.name}<small>${HALLS[g.hall]}</small></h2><span class="when">${g.hours}</span></div>
    <div class="week" aria-label="ימי אימון: ${dayText(g)}">${DAYS.map((d, k) => `<span class="${g.days.includes(k) ? "on" : ""}">${d}</span>`).join("")}</div>
    <div class="price"><span>מאמן <b>${g.coach}</b></span>${g.price.map((p) => `<span>${p}</span>`).join("")}</div>
    <a class="go" href="${waLink(g)}" target="_blank" rel="noopener">${WA}קבעו אימון ניסיון <em>בוואטסאפ</em></a>`;
  return a;
}


// The ball: hops on an arc from wherever it is now to the chosen button, lands with a small squash.
const ball = document.getElementById("ball");
let ballAnim = null;
function spot(el) {
  const r = el.getBoundingClientRect();
  return { x: r.left + r.width / 2 - 10 + scrollX, y: r.top - 14 + scrollY };
}
function current() {
  const r = ball.getBoundingClientRect();
  return { x: r.left + scrollX, y: r.top + scrollY };
}
function hop(el, first) {
  if (!el) return;
  const to = spot(el);
  const reduce = calm();
  const from = ball.hidden ? (first ? { x: to.x, y: to.y - 140 } : to) : current();
  ball.hidden = false;
  if (ballAnim) ballAnim.cancel();
  if (reduce) { ball.style.transform = `translate(${to.x}px,${to.y}px)`; return; }
  const dx = to.x - from.x, dy = to.y - from.y, dist = Math.hypot(dx, dy);
  const lift = first ? 0 : Math.min(140, Math.max(46, dist * 0.45));
  const frames = [];
  const N = 14;
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const x = from.x + dx * t;
    const y = first ? from.y + dy * (t * t) : from.y + dy * t - lift * 4 * t * (1 - t);
    frames.push({ transform: `translate(${x}px,${y}px)`, offset: t * 0.78 });
  }
  frames.push({ transform: `translate(${to.x}px,${to.y + 3}px) scale(1.25,.72)`, offset: 0.86 });
  frames.push({ transform: `translate(${to.x}px,${to.y - (first ? 26 : 8)}px) scale(.94,1.06)`, offset: 0.94 });
  frames.push({ transform: `translate(${to.x}px,${to.y}px)`, offset: 1 });
  ballAnim = ball.animate(frames, { duration: first ? 900 : 560, easing: "linear", fill: "forwards" });
  ballAnim.onfinish = () => { ball.style.transform = `translate(${to.x}px,${to.y}px)`; };
}
const pressed = (id) => document.querySelector(`#${id} button[aria-pressed="true"]`);
addEventListener("resize", () => { const el = pressed("who"); if (el) { if (ballAnim) ballAnim.cancel(); const p = spot(el); ball.style.transform = `translate(${p.x}px,${p.y}px)`; } });

const mine = () => GROUPS.filter((g) => g.who === who);
function renderCards() {
  const box = document.getElementById("results");
  box.innerHTML = "";
  mine().filter((g) => where === "all" || g.hall === where).forEach((g, i) => box.append(card(g, i)));
}
function renderResults() { renderWhere([...new Set(mine().map((g) => g.hall))]); renderCards(); }

document.getElementById("weekall").innerHTML = "<h3>כל האימונים בשבוע</h3><dl>" +
  Object.entries(HALLS).map(([id, name]) => `<dt>${name}</dt>` +
    GROUPS.filter((g) => g.hall === id).map((g) => `<dd><span>${g.name}</span><span>${dayText(g)}, ${g.hours}</span></dd>`).join("")).join("") + "</dl>";

document.getElementById("copy").addEventListener("click", (e) => {
  const btn = e.currentTarget;
  navigator.clipboard.writeText("050-4999149").then(() => { btn.textContent = "הועתק"; }).catch(() => {
    const r = document.createRange(); r.selectNodeContents(document.getElementById("phone"));
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  });
});
addEventListener("resize", placeThumb);
document.documentElement.dir = "rtl"; document.documentElement.lang = "he";
renderWho(); renderResults();
requestAnimationFrame(() => setTimeout(() => hop(pressed("who"), true), 250));
</script>

</body>
</html>
